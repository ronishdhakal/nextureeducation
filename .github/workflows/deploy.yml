name: CI / Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys run one after another; a running deploy is never cancelled half way.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Backend checks
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-dummy-key-not-used-anywhere
          DJANGO_DEBUG: "True"
        run: |
          pip install -r requirements.txt
          python manage.py check
          # every model change must come with a committed migration
          python manage.py makemigrations --check --dry-run

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint and build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    name: Deploy to server
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The server forces its own command for this key, so the "deploy" argument is
      # ignored. A non-zero exit from the server fails this step and therefore the job.
      - name: Run deploy on the server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            "$SSH_USER@$SSH_HOST" deploy

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
