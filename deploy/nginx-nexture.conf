# Host nginx config for the Nexture stack. Replace the domains if they differ,
# put the file in /etc/nginx/sites-available/, symlink it into sites-enabled/,
# then run: nginx -t && systemctl reload nginx
# After that, get certificates with: certbot --nginx -d nexture.edu.np -d www.nexture.edu.np -d api.nexture.edu.np

# --- Public website (Next.js) ------------------------------------------------
server {
    listen 80;
    server_name nexture.edu.np www.nexture.edu.np;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- API + uploaded media (Django) -------------------------------------------
server {
    listen 80;
    server_name api.nexture.edu.np;

    # Image and document uploads from the admin panel.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
