# Production stack for the shared server. Everything binds to 127.0.0.1 so only
# the host nginx can reach it, and the database is private to this project.
#
#   cp deploy/.env.example .env     # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build
#
# See DEPLOY.md for the full walkthrough.

name: nexture

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nexture}
      POSTGRES_USER: ${DB_USER:-nexture}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nexture} -d ${DB_NAME:-nexture}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60
             --access-logfile -"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "False"
      # "backend" is the host name the frontend container uses for server-side requests.
      DJANGO_ALLOWED_HOSTS: ${API_DOMAIN:?Set API_DOMAIN in .env},backend,localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${API_DOMAIN},https://${SITE_DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN},https://www.${SITE_DOMAIN}
      MEDIA_PUBLIC_URL: https://${API_DOMAIN}/media/
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-0}
      DB_NAME: ${DB_NAME:-nexture}
      DB_USER: ${DB_USER:-nexture}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      USE_R2_STORAGE: ${USE_R2_STORAGE:-False}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      LEAD_NOTIFICATION_EMAIL: ${LEAD_NOTIFICATION_EMAIL:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8082}:8000"
    volumes:
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}/api
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        NEXT_PUBLIC_MEDIA_HOSTNAME: ${R2_PUBLIC_DOMAIN:-${API_DOMAIN}}
    restart: unless-stopped
    environment:
      # Server-side renders talk to the API over the private docker network.
      API_URL_INTERNAL: http://backend:8000/api
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN}/api
      NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3082}:3000"

volumes:
  postgres_data:
  media_data:
